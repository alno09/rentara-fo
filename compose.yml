services:
  postgres:
    image: postgres:18
    container_name: rentara-fo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: rentara_fo
      POSTGRES_USER: rentara
      POSTGRES_PASSWORD: rentara_dev

    ports:
      - "5432:5432"

    volumes:
      - rentara_fo_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentara -d rentara_fo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rentara_fo_postgres_data: